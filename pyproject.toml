[project]
name = "digit-classification"
version = "0.1.0"
description = "A reproducible classifier for the MNIST digits 0, 5, and 8."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightning>=2.5.0",
    "pillow>=11.0.0",
    "scikit-learn>=1.6.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
digit-classification = "digit_classification.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digit_classification"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

